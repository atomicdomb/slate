[package]
name = "slate"
version = "0.1.0"
edition = "2021"
description = "A small native code editor with a minimap and switchable syntax themes"

[dependencies]
eframe = { version = "0.32", features = ["persistence"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
